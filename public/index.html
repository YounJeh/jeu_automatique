<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeu automatique</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
        background: #05070f;
        font-family: system-ui, sans-serif;
        color: #ffffff;
        box-sizing: border-box;
      }

      select,
      button,
      textarea {
        padding: 8px 20px;
        font-size: 16px;
        border-radius: 6px;
        border: none;
        font-family: inherit;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      canvas {
        border: 2px solid #ffffff33;
        border-radius: 8px;
      }

      #game-description {
        max-width: 480px;
        text-align: center;
        color: #ffffffcc;
      }

      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .mode-nav {
        display: flex;
        gap: 8px;
      }

      .mode-button[aria-pressed="true"] {
        background: #4fd1c5;
        color: #05070f;
        font-weight: bold;
      }

      #play-section,
      #create-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: 100%;
      }

      #create-section {
        max-width: 480px;
      }

      .chat-messages {
        width: 100%;
        max-height: 260px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #0b1021;
        border-radius: 8px;
        padding: 12px;
        box-sizing: border-box;
      }

      .chat-message {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .chat-message__role {
        font-size: 12px;
        color: #ffffff88;
      }

      .chat-message__content {
        margin: 0;
        white-space: pre-wrap;
      }

      .chat-message--error .chat-message__content {
        color: #f56565;
      }

      .chat-form {
        width: 100%;
        display: flex;
        gap: 8px;
      }

      .chat-form textarea {
        flex: 1;
        resize: vertical;
      }

      .generation-status {
        min-height: 1em;
        color: #4fd1c5;
      }

      .generation-error {
        min-height: 1em;
        color: #f56565;
      }

      .chat-actions {
        display: flex;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <nav class="mode-nav">
      <button
        id="mode-play-button"
        class="mode-button"
        type="button"
        aria-pressed="true"
      >
        Jouer
      </button>
      <button
        id="mode-create-button"
        class="mode-button"
        type="button"
        aria-pressed="false"
      >
        Créer un jeu
      </button>
    </nav>

    <section id="play-section">
      <div class="controls">
        <label for="game-select">Jeu :</label>
        <select id="game-select"></select>
        <button id="restart-button" type="button">Recommencer</button>
      </div>
      <h1 id="game-title"></h1>
      <p id="game-description"></p>
      <canvas id="game-canvas"></canvas>
      <p id="game-status"></p>
    </section>

    <section id="create-section" hidden>
      <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
      <p id="generation-status" class="generation-status"></p>
      <p id="generation-error" class="generation-error" role="alert"></p>
      <form id="chat-form" class="chat-form">
        <textarea
          id="chat-input"
          rows="2"
          placeholder="Décris le jeu que tu veux créer..."
        ></textarea>
        <button id="chat-send-button" type="submit">Envoyer</button>
      </form>
      <div class="chat-actions">
        <button id="test-generated-game-button" type="button" disabled>
          Tester le jeu
        </button>
        <button id="back-to-games-button" type="button">Retour aux jeux</button>
      </div>
    </section>

    <script type="module" src="./dist/app/index.js"></script>
  </body>
</html>
