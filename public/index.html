<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeu automatique</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
        background: #05070f;
        font-family: system-ui, sans-serif;
        color: #ffffff;
        box-sizing: border-box;
      }

      select,
      button {
        padding: 8px 20px;
        font-size: 16px;
        border-radius: 6px;
        border: none;
        font-family: inherit;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      canvas {
        border: 2px solid #ffffff33;
        border-radius: 8px;
      }

      #game-description {
        max-width: 480px;
        text-align: center;
        color: #ffffffcc;
      }

      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      #play-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <section id="play-section">
      <div class="controls">
        <label for="game-select">Jeu :</label>
        <select id="game-select"></select>
        <button id="restart-button" type="button">Recommencer</button>
      </div>
      <h1 id="game-title"></h1>
      <p id="game-description"></p>
      <canvas id="game-canvas"></canvas>
      <p id="game-status"></p>
    </section>

    <script type="module" src="./dist/app/index.js"></script>
  </body>
</html>
